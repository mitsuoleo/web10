<div class="chic-card">
    <h2 class="page-title">Recuperar Senha</h2>
    <p class="subtitulo">Informe o e-mail e o CPF do cadastro e escolha uma nova senha.</p>

    @if (erro()) {
    <div class="alert-erro">⚠ {{ erro() }}</div>
    }

    @if (sucesso()) {
    <div class="alert-sucesso">✓ Senha alterada! Redirecionando para o login...</div>
    }

    <form (ngSubmit)="redefinir()" novalidate>
        <div class="form-group">
            <label for="txtEmail">E-mail</label>
            <input type="email" id="txtEmail" [(ngModel)]="email" name="email" placeholder="Seu e-mail cadastrado">
        </div>
        <div class="form-group">
            <label for="txtCpf">CPF</label>
            <input type="text" id="txtCpf" [(ngModel)]="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14">
        </div>
        <div class="form-group">
            <label for="txtNovaSenha">Nova senha</label>
            <input type="password" id="txtNovaSenha" [(ngModel)]="novaSenha" name="novaSenha"
                placeholder="Mín. 8 caracteres">
        </div>
        <div class="form-group">
            <label for="txtConfirma">Confirme a nova senha</label>
            <input type="password" id="txtConfirma" [(ngModel)]="confirmaSenha" name="confirmaSenha"
                placeholder="Repita a senha">
        </div>

        <button type="submit" class="btn-primary btn-full" style="margin-top: 1rem;"
            [disabled]="enviando() || sucesso()">{{ enviando() ? 'Salvando...' : 'Redefinir senha' }}</button>
    </form>

    <p class="voltar"><a routerLink="/login">Voltar para o login</a></p>
</div>
